<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY ANNIVERSARY, LOVE</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom right, #f7d5e0, #e0c3cf);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #5c2a36;
            overflow: hidden;
            background-image: url("hihi.jpg"); /* Add background image */
            background-size: cover; /* Cover the entire background */
            background-repeat: no-repeat; /* Prevent image repetition */
            background-position: center; /* Center the image */
        }

        .container {
            text-align: center;
            padding: 40px;
            background-color: rgb(250, 162, 162);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            max-width: 600px; /* Adjusted width */
        }

        img {
            max-width: 100%; /* Image fits container */
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px; /* Space between buttons */
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease; /* Smooth hover */
        }

        .next-page-button {
    position: absolute; /* Key for positioning */
    top: 20px; /* Adjust from the top */
    right: 20px; /* Adjust from the right */
    /* Remove or adjust these as needed */
    display: inline-block;
    padding: 10px 20px;
    background-color: #d13f5c;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    /* margin-top: 20px; Remove or adjust as needed */
    transition: background-color 0.3s ease;
}

        #yes-button {
            background-color: #d13f5c;
            color: white;
            margin-bottom: 20%;
            
        }

        #yes-button:hover {
            background-color: #ddd;
        }

        #no-button {
            background-color: #c03651;
            color: white;
            transition: background-color 0.3s ease, transform 0.2s ease;
            position: absolute; /* Essential for random positioning */
           
            margin-right: -3px;
            margin-top: 10vh;
        }

        #no-button:hover {
            background-color: #ddd;
    
        }

        .next-page-button {
            display: inline-block; /* Make it a block element */
            padding: 10px 20px; /* Adjust padding as needed */
            background-color: #d13f5c; /* Use a color that matches your design */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px; /* Add some space above the button */
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }


    </style>
</head>
<body>

    <div class="container">
        <img src="Spider man and hello kitty.jpg" alt="Anniversary Image" width="300" height="200">
        <p>DO YOU LOVE ME? HEHE</p>
          <div class="buttons">
            <button id="yes-button">Yes!</button>
            <button id="no-button">No</button>
            
          
        </div>
    </div>
    <a href="try.html" class="next-page-button">Play this first</a>  </div>
    
    <script>
        const yesButton = document.getElementById('yes-button');
        const noButton = document.getElementById('no-button');
        const buttonsContainer = document.querySelector('.buttons'); // Get the container

        yesButton.addEventListener('click', () => {
            window.location.href = '1yearhehe.html';
        });

        noButton.addEventListener('click', () => {
            const maxX = buttonsContainer.offsetWidth - noButton.offsetWidth; // Boundaries
            const maxY = buttonsContainer.offsetHeight - noButton.offsetHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noButton.style.left = randomX + 'px'; // Set new position
            noButton.style.top = randomY + 'px';
        });
    </script>

</body>
</html>
