<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY ANNIVERSARY, LOVE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #5c2a36;
            background-image: url("download (9).jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 20px;
            padding: 0 20px;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        #timer {
            font-family: 'Courier New', monospace;
            font-size: clamp(1.2rem, 4vw, 3rem);
            margin: 20px 0;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.9);
            border: 3px solid #f0f0f0;
            text-align: center;
            width: 100%;
            max-width: 800px;
            backdrop-filter: blur(5px);
        }

        #timer span {
            font-weight: bold;
            color: #d13f5c;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            display: inline-block;
            margin: 0 2px;
        }

        #timer span.unit {
            font-weight: normal;
            color: #777;
            font-size: 0.8em;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            display: inline-block;
            padding: 10px 15px;
            background-color: #d13f5c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            font-size: clamp(0.8rem, 3vw, 1rem);
            z-index: 100;
        }

        .back-button:hover {
            background-color: #c03651;
        }

        /* Mobile-specific adjustments */
        @media (max-width: 600px) {
            h1 {
                margin-bottom: 100px;
            }
            
            #timer {
                padding: 10px 15px;
                font-size: 1rem;
            }
            
            #timer span.unit {
                display: block;
                margin: 0;
            }
            
            .back-button {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
            }
        }

        /* Tablet adjustments */
        @media (min-width: 601px) and (max-width: 900px) {
            h1 {
                margin-bottom: 150px;
            }
        }
    </style>
</head>
<body>
    <a href="1yearhehe.html" class="back-button">Back</a>
    <h1>How long since we started talking?</h1>
    <div id="timer"></div>

    <script>
        const startDate = new Date('2024-02-16T00:12:49');
        const timerDisplay = document.getElementById('timer');

        function updateTimer() {
            const now = new Date();
            const timeDifference = now - startDate;

            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            // Format for better mobile display
            if (window.innerWidth <= 600) {
                timerDisplay.innerHTML = `
                    <span>${days}</span><span class="unit">days</span><br>
                    <span>${hours}</span><span class="unit">hours</span><br>
                    <span>${minutes}</span><span class="unit">minutes</span><br>
                    <span>${seconds}</span><span class="unit">seconds</span>
                `;
            } else {
                timerDisplay.innerHTML = `
                    <span>${days}</span><span class="unit">days</span>
                    <span>${hours}</span><span class="unit">hours</span>
                    <span>${minutes}</span><span class="unit">minutes</span>
                    <span>${seconds}</span><span class="unit">seconds</span>
                `;
            }
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // Update layout when window is resized
        window.addEventListener('resize', updateTimer);
    </script>
</body>
</html>
