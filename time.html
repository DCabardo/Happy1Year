<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY ANNIVERSARY, LOVE</title>
    <style>
    
    body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #5c2a36;
            background-image: url("download (9).jpg"); /* Add background image */
            background-size: cover; /* Cover the entire background */
            background-repeat: no-repeat; /* Prevent image repetition */
            background-position: center; /* Center the image */
            /* Optional: Add a semi-transparent overlay if the image makes text hard to read */
            /* background-color: rgba(248, 240, 227, 0.7);  Adjust the alpha (0.7) for transparency */
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 180px;
        }

        #timer {
    font-family: 'Courier New', monospace; /* Time-like font */
    font-size: 3em; /* Slightly larger timer */
    position: fixed;
    margin-top: 5px; /* More margin */
    padding: 20px 50px; /* More padding */
    border-radius: 15px; /* More rounded corners */
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); /* More prominent shadow */
    background-color: #fff; /* White background for contrast */
    border: 8px solid #f0f0f0; /* Light gray border */
    /* Add a subtle gradient (optional) */
    background-image: linear-gradient(to bottom, #ffffff, #f9f9f9); 
    /* Or a subtle texture (optional - requires a background image) */
    /* background-image: url("subtle_texture.png");
    background-size: cover; */
    text-align: center; /* Center the text within the timer */
}

#timer span {
    font-weight: bold;
    color: #d13f5c; /* Use a color that fits your theme */
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1); /* Add a text shadow */
}

#timer span.unit {
    font-weight: normal;
    margin-left: 5px;
    color: #777; /* Slightly darker color for units */
}

/* Add a "glow" effect on hover (optional) */
#timer:hover {
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
    transform: translateY(-2px); /* Slightly move up on hover */
    transition: all 0.2s ease; /* Smooth transition */
}


/*  Alternative timer style - more modern */
.timer-modern {
    font-family: 'Arial', sans-serif; /* Use a modern font */
    font-size: 2.2em;
    margin-top: 20px;
    padding: 25px 40px;
    border-radius: 20px;
    background-color: #f8f8f8;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    border: none; /* No border */
    color: #333; /* Darker text color */
    text-align: center;
    overflow: hidden; /* For positioning the pseudo-element */
    position: relative; /* For positioning the pseudo-element */
}

.timer-modern::before { /* Add a subtle "ribbon" effect */
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background-color: #d13f5c; /* Your theme color */
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
}

.timer-modern span {
    font-weight: 600; /* Slightly less bold */
    color: #555;
}

.timer-modern span.unit {
    font-weight: normal;
    margin-left: 8px;
    color: #888;
}

.timer-modern:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    transition: all 0.2s ease;
}

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #5c2a36;
            text-decoration: none;
            font-size: 1.1em;
            transition: color 0.3s;
            z-index: 10;
        }

        .next-page-buttongg {
    position: absolute;
    top: 20px;
    left: 20px; /* Changed from right to left */
    display: inline-block;
    padding: 10px 20px;
    background-color: #d13f5c;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s ease;
}

       
    </style>
</head>
<body>
    <h1>How long since we started talking?</h1>
    <div id="timer"></div>
    <a href="1yearhehe.html" class="next-page-buttongg">Back</a>  </div>

    <script>
       const startDate = new Date('2024-02-16T00:12:49'); // Set your start date and time (YYYY-MM-DDTHH:mm:ss)
        const timerDisplay = document.getElementById('timer');

        function updateTimer() {
            const now = new Date();
            const timeDifference = now - startDate; // Difference in milliseconds

            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            timerDisplay.textContent = `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
        }

        updateTimer(); // Initial update
        setInterval(updateTimer, 1000); // Update every second
    </script>

</body>
</html>
