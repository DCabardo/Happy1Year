<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY ANNIVERSARY, LOVE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom right, #f7d5e0, #e0c3cf);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #5c2a36;
            background-image: url("hihi.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 30px;
            background-color: rgba(250, 162, 162, 0.9);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            position: relative;
            backdrop-filter: blur(5px);
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
            max-height: 40vh;
        }

        p {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            position: relative;
            min-height: 100px;
            margin-bottom: 20px;
        }

        .action-button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: bold;
            z-index: 10;
            position: relative;
        }

        #yes-button {
            background-color: #d13f5c;
            color: white;
        }

        #yes-button:hover {
            background-color: #e74c6d;
            transform: scale(1.05);
        }

        #no-button {
            background-color: #c03651;
            color: white;
            transition: all 0.2s ease;
            position: absolute;
        }

        #no-button:hover {
            background-color: #d13f5c;
        }

        .nav-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #d13f5c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            z-index: 100;
        }

        .nav-button:hover {
            background-color: #e74c6d;
        }

        /* Mobile-specific adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .buttons-container {
                gap: 15px;
                min-height: 80px;
            }
            
            .action-button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            
            .nav-button {
                top: 10px;
                right: 10px;
                padding: 8px 15px;
                font-size: 0.9rem;
            }
            
            img {
                max-height: 30vh;
            }
        }

        /* Tablet adjustments */
        @media (min-width: 601px) and (max-width: 900px) {
            .container {
                max-width: 500px;
            }
        }
    </style>
</head>
<body>
    <a href="try.html" class="nav-button">Play this first</a>

    <div class="container">
        <img src="Spider man and hello kitty.jpg" alt="Anniversary Image">
        <p>DO YOU LOVE ME? HEHE</p>
        <div class="buttons-container">
            <button id="yes-button" class="action-button">Yes!</button>
            <button id="no-button" class="action-button">No</button>
        </div>
    </div>
    
    <script>
        const yesButton = document.getElementById('yes-button');
        const noButton = document.getElementById('no-button');
        const buttonsContainer = document.querySelector('.buttons-container');

        yesButton.addEventListener('click', () => {
            window.location.href = '1yearhehe.html';
        });

        noButton.addEventListener('click', () => {
            const containerRect = buttonsContainer.getBoundingClientRect();
            const buttonRect = noButton.getBoundingClientRect();
            
            const maxX = containerRect.width - buttonRect.width;
            const maxY = containerRect.height - buttonRect.height;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noButton.style.left = randomX + 'px';
            noButton.style.top = randomY + 'px';
        });

        // Initial position for the "No" button
        noButton.style.position = 'absolute';
        noButton.style.left = '50%';
        noButton.style.top = '0';
        noButton.style.transform = 'translateX(-50%)';
    </script>
</body>
</html>
